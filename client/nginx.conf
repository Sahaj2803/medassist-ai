server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip the same asset types Vite emits, mirroring the backend's
    # compression middleware so both legs of the app are compressed.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
                text/xml application/xml application/xml+rss text/javascript
                image/svg+xml;
    gzip_min_length 1024;

    # Proxy API calls to the backend container (service name "backend" in
    # docker-compose.yml). Cookies and headers are forwarded so JWT auth
    # keeps working exactly as it does in local dev via the Vite proxy.
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }

    # Uploaded prescription images/PDFs, served by the backend
    location /uploads/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
    }

    # Cache hashed static assets aggressively — Vite fingerprints
    # filenames, so a new deploy naturally busts this cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: any other path serves index.html so React Router
    # handles client-side routing (e.g. a hard refresh on /prescriptions/123)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
